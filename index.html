<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>சமணத் திருமண மாலை</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="site-header">
    <div class="header-content">
      <h1 class="logo">சமணத் திருமண மாலை</h1>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="girls">மணமகள் <span class="tab-count" id="girls-count">0</span></button>
    <button class="tab-btn" data-tab="boys">மணமகன் <span class="tab-count" id="boys-count">0</span></button>
  </nav>

  <!-- Search & Filter Bar -->
  <section class="controls">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search by name, job, education, location..." autocomplete="off">
      <button class="clear-btn" id="clear-search" title="Clear search">&times;</button>
    </div>
    <button class="filter-toggle-btn" id="filter-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
        <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
      </svg>
      <span id="filter-toggle-label">Open Filters</span>
      <span class="filter-badge" id="filter-badge" style="display:none;">0</span>
    </button>
  </section>

  <!-- Filter Panel -->
  <section class="filter-panel" id="filter-panel">
    <div class="filter-panel-header">
      <h3>Filter Profiles</h3>
      <button class="reset-filters-btn" id="reset-filters">Reset All</button>
    </div>
    <div class="filter-rows" id="filter-rows">
      <!-- Filters rendered by JS -->
    </div>
  </section>

  <!-- Results Info -->
  <div class="results-info">
    <span id="results-count">0 profiles found</span>
    <button class="print-btn" id="print-btn" title="Print filtered results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
      </svg>
      Print
    </button>
  </div>

  <!-- Cards Grid -->
  <main class="cards-grid" id="cards-grid">
    <!-- Cards rendered by JS -->
  </main>

  <!-- No Results -->
  <div class="no-results" id="no-results" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/>
    </svg>
    <p>No profiles match your search or filters.</p>
    <button class="reset-btn" id="reset-all">Clear All Filters</button>
  </div>

  <!-- Print Area (hidden, used only for printing) -->
  <div id="print-area"></div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 சமணத் திருமண மாலை</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
